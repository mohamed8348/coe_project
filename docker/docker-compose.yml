version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=erp_user
      - POSTGRES_PASSWORD=erp_pass
      - POSTGRES_DB=erp_assistant
      - POSTGRES_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp_net
    volumes:
      - ../api:/app/api
      - ../src:/app/src

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - app
    networks:
      - erp_net
    volumes:
      - ../frontend:/app
      - /app/node_modules

  postgres:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_USER=erp_user
      - POSTGRES_PASSWORD=erp_pass
      - POSTGRES_DB=erp_assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    networks:
      - erp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  erp_net:
    driver: bridge

volumes:
  postgres_data:
